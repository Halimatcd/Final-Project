name: Terraform Security Scan

# Runs static analysis and security scanning:
#  - on every push to the staging branch
#  - on every pull request opened against prod
on:
  push:
    branches:
      - prod
      - main
      -staging
  pull_request:
    branches:
      - prod

permissions:
  contents: read

jobs:
  scan:
    name: tflint + trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      # ---- tflint: lint all modules and environments ----
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --minimum-failure-severity=error

      # ---- trivy: scan IaC for misconfigurations and secrets ----
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          hide-progress: false

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
